name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          # Newest installed Xcode, so builds pick up the latest SDK (e.g. macOS 27 FoundationModels errors).
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "$XCODE"
          sw_vers
          xcodebuild -version
          swift --version

      - uses: actions/cache@v6
        with:
          path: |
            .build
            .build-arm64
            .build-x86_64
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: |
          swift scripts/MakeFixtures.swift
          scripts/test.sh

      - name: Package (ad hoc, universal)
        run: |
          scripts/bundle.sh
          lipo -info dist/Voiccenger.app/Contents/MacOS/Voiccenger dist/voiccenger-cli
          plutil -extract LSMinimumSystemVersion raw dist/Voiccenger.app/Contents/Info.plist
          scripts/make-dmg.sh dist/Voiccenger.app "dist/Voiccenger-${GITHUB_SHA::7}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: Voiccenger-${{ github.sha }}
          path: dist/*.dmg
          retention-days: 14

      # The universal CLI and the generated fixtures, for the older-macOS and Intel runs below.
      - uses: actions/upload-artifact@v7
        with:
          name: tiers-${{ github.sha }}
          path: |
            dist/voiccenger-cli
            .fixtures/meeting.wav
            .fixtures/meeting.truth.json
          include-hidden-files: true
          retention-days: 3

  # Proves the lower tiers run the macOS 26-built universal binary: macOS 14 on Apple silicon
  # (macos-14 retires 2026-11-02; then use macos-15) and Intel on macOS 15 and 26.
  tiers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: tiers-${{ github.sha }}

      - name: Capabilities
        run: |
          sw_vers; uname -m
          chmod +x dist/voiccenger-cli
          dist/voiccenger-cli capabilities --json | tee capabilities.json
          dist/voiccenger-cli capabilities
          # Intel: neither on-device model runs, Apple Speech (classic) is the engine.
          if [[ "$(uname -m)" == x86_64 ]]; then
            grep -q '"defaultSpeechEngine" : "apple"' capabilities.json
          fi

      # Every tier: Apple Speech before macOS 26's SpeechTranscriber is the classic recognizer. Headless runners
      # may deny (or never answer) the speech-recognition permission; that case is reported as a note below
      # instead of failing the job. A wrong transcript (word error rate over the limit) still fails.
      - name: Apple Speech transcription of the fixture meeting
        id: apple
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -o pipefail
          time dist/voiccenger-cli transcribe .fixtures/meeting.wav --engine apple --language en \
            --truth .fixtures/meeting.truth.json --max-wer 0.25 2>&1 | tee apple.log

      - name: Apple Speech result
        if: always()
        run: |
          wer="$(grep -o 'WER [0-9.]*%' apple.log 2>/dev/null || true)"
          if [[ "${{ steps.apple.outcome }}" == success ]]; then
            echo "✅ ${{ matrix.runner }}: Apple Speech transcription $wer" >>"$GITHUB_STEP_SUMMARY"
          elif [[ -z "$wer" ]] && ! grep -q 'above --max-wer' apple.log 2>/dev/null; then
            echo "⚠️ ${{ matrix.runner }}: Apple Speech transcription not checked (non-blocking): speech-recognition permission is unavailable on this headless runner. $(grep -m1 -i 'error' apple.log 2>/dev/null || echo 'Step timed out waiting for permission.')" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "❌ ${{ matrix.runner }}: Apple Speech transcription $wer (limit 25%)" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/cache@v6
        if: runner.arch == 'ARM64'
        with:
          path: ~/Library/Application Support/Voiccenger/Models/whisper
          key: whisper-large-v3-turbo-v1

      # GitHub's Apple silicon runners are virtual machines without a Neural Engine; on macos-14 Core ML
      # refused WhisperKit's models there ("Unable to compute the asynchronous prediction using ML Program").
      # A Core ML refusal is reported as a non-blocking note; a wrong transcript still fails.
      - name: Whisper transcription of the fixture meeting (Apple silicon)
        id: whisper
        if: runner.arch == 'ARM64'
        continue-on-error: true
        run: |
          set -o pipefail
          dist/voiccenger-cli models download whisper
          time dist/voiccenger-cli transcribe .fixtures/meeting.wav --engine whisper --language en \
            --truth .fixtures/meeting.truth.json --max-wer 0.25 2>&1 | tee whisper.log

      - name: Whisper result
        if: always() && runner.arch == 'ARM64'
        run: |
          wer="$(grep -o 'WER [0-9.]*%' whisper.log 2>/dev/null || true)"
          if [[ "${{ steps.whisper.outcome }}" == success ]]; then
            echo "✅ ${{ matrix.runner }}: Whisper transcription $wer" >>"$GITHUB_STEP_SUMMARY"
          elif grep -q 'ML Program' whisper.log 2>/dev/null; then
            echo "⚠️ ${{ matrix.runner }}: Whisper not checked (non-blocking): Core ML can't run the model in this runner VM: $(grep -m1 'error:' whisper.log)" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "❌ ${{ matrix.runner }}: Whisper transcription failed $wer" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
